,ready:'Ready? Meet your interviewer',noCharge:'Preview only · no payment taken',researchEye:'Real preparation. Fictional interviewers.',researchTitle:'There’s homework behind the humor.',researchDesc:'Published company guidance informs the practice. Every generated question will be a simulation, not an insider promise.',r1Title:'Amazon · concrete evidence',r1Body:'Its SDE II guide combines technical skills with examples linked to Leadership Principles. Role-specific details matter.',r2Title:'Adobe · the work you do',r2Body:'Adobe describes different assessments for technical, creative and other roles. Practice should reflect the position.',r3Title:'OpenAI · explain your thinking',r3Body:'Its guide describes team-dependent skills assessments and emphasizes reasoning, communication and collaboration.',official:'Read official guidance ↗',researchLimit:'Research reviewed October 16, 2026. Coverage varies: Apple and IBM are pending; Google and Meta need further verification. Company assignments are provisional.',researchLink:'See the research and its limitations ↗',feedbackEye:'After the interview',feedbackTitle:'Practice notes. Not a verdict.',feedbackDesc:'Planned: an optional paid report with specific examples, stronger ways to answer and what to practice next. Delivered by email. Separate price shown before purchase.',feedbackButton:'How feedback will work',footerTag:'A little more ready.',aboutLabel:'About',privacyLabel:'Privacy',aiLabel:'AI & limitations',footerPreview:'IN DEVELOPMENT',humors:['Straight-faced','A little mischief','Full mischief'],assigned:'Your interviewer: ',welcome:'Your chair is ready.',previewLabel:'INTERVIEW PREVIEW · SCRIPTED SAMPLE',resumeYes:'Résumé added for this preview',resumeNo:'No résumé added',payPending:'$1 interview · PayPal setup pending',payNote:'This is a scripted introduction, not an AI response. No interview has started, no payment was taken and no report has been created.',back:'Back to setup',aboutTitle:'A rehearsal before the real thing.',aboutText:'NuTak is an independent interview-practice project from Useless Instruments. Fifteen fictional AI interviewers, each with a company focus, help you rehearse for a real conversation.\n\nThe first goal is useful practice—with enough humor to make trying again easier. NuTak is not affiliated with or endorsed by any listed employer.',privacyTitle:'Your information, in this preview.',privacyText:'Nickname, position and résumé text stay in this page’s memory. This preview has no backend, analytics, cookies, payment processing or email collection. Refreshing or closing clears the form data from the application’s memory; your browser may independently restore form fields.\n\nExternal source links open third-party websites with their own policies.\n\nBefore live launch, we will explain AI-provider processing, interview storage, retention and deletion. No storage or privacy promises for a future service are being made here.',aiTitle:'Practice—not a hiring decision.',aiText:'The interviewers are fictional AI characters, not employees of the companies. In this preview, introductions are scripted and no AI service is connected.\n\nPlanned live questions will be simulated using role information and researched company guidance. AI feedback can be wrong and cannot predict a hiring decision. Real interview formats vary by team, role and region. Follow your recruiter’s instructions.\n\nEnglish and Russian are practice-language options; they do not imply that an employer offers interviews in both languages.',feedbackTitleModal:'Useful feedback, when you want it.',feedbackText:'The planned $1 payment opens one interview. A detailed report will be an optional separate purchase. Its price is not set yet.\n\nOnly report buyers will be asked for an email address. Payment must be verified before delivery. PayPal may independently ask for payment or account information.\n\nThe report will assess answers with evidence, suggest improvements and invite another attempt. It will not score your worth or promise a job. Payments and email delivery are not active in this preview.'},ru:{navPeople:'Ваш интервьюер',navResearch:'Основа вопросов',eyebrow:'Немного волнения. Немного практики.',heroTitle:'Собеседование?<br><em>Порепетируем.</em>',lead:'Серьёзная подготовка. Несерьёзное чувство юмора. Познакомьтесь с тем, кто задаст вопрос, которого вы надеялись избежать.',start:'Присаживайтесь',heroMicro:'English / Русский · $1 за интервью после запуска',artNote:'«Спокойно. Это всего лишь ваше будущее».',ticket:'ОДНО МЕСТО. ОДНА РЕПЕТИЦИЯ.',ticketBottom:'Без подписки.',strip1:'15 AI-интервьюеров с характером',strip2:'С учётом выбранной компании',strip3:'Достаточно псевдонима',strip4:'Русский и английский',peopleEye:'По ту сторону стола',peopleTitle:'Хорошие вопросы. Непростые собеседники.',peopleDesc:'У каждой компании свой интервьюер. Разные характеры. Одна цель: полезная практика.',roster:'Все 15 интервьюеров ↗',setupEye:'Теперь вы',setupTitle:'Как к вам<br>обращаться?',setupDesc:'Имени или псевдонима достаточно. Опыт берите с собой. Идеальные ответы оставьте дома.',step1:'Выберите компанию и должность.',step2:'Познакомьтесь с интервьюером.',step3:'Попробуйте, подумайте, повторите.',previewNotice:'Предварительная версия. AI-интервью, сохранение, оплата и отправка отчётов ещё не подключены. Введённые данные никуда не отправляются и не сохраняются.',nameLabel:'Имя или псевдоним',namePlaceholder:'Как вас называть?',nameHelp:'Без регистрации. Фамилия не нужна.',companyLabel:'Компания',positionLabel:'Должность',positionPlaceholder:'Например, инженер-программист',difficultyLabel:'Сложность интервью',gentle:'Мягкий старт',realistic:'Как настоящее',challenging:'Дайте задачу посложнее',humorLabel:'Сколько юмора?',resumeLabel:'Добавить резюме · необязательно',resumeBoxLabel:'Опыт, навыки и образование',resumePlaceholder:'Вставьте полезную часть резюме. Имя и контакты не нужны.',resumeHelp:'Можно пропустить. Удалите контакты и конфиденциальные сведения. В этой версии текст остаётся только на открытой странице; обновление или закрытие очищает память приложения.',ready:'Готовы? Знакомимся',noCharge:'Предпросмотр · без оплаты',researchEye:'Реальная подготовка. Вымышленные интервьюеры.',researchTitle:'За юмором — домашняя работа.',researchDesc:'Основа практики — опубликованные материалы компаний. Будущие AI-вопросы будут учебными, а не обещанием инсайдерской информации.',r1Title:'Amazon · конкретные примеры',r1Body:'Руководство для SDE II сочетает технические навыки с примерами по Leadership Principles. Важна конкретная должность.',r2Title:'Adobe · ваша работа',r2Body:'Adobe описывает разные задания для технических, творческих и других ролей. Практика должна соответствовать должности.',r3Title:'OpenAI · ход ваших мыслей',r3Body:'Руководство описывает задания, зависящие от команды, и подчёркивает важность рассуждений, общения и совместной работы.',official:'Материалы компании ↗',researchLimit:'Материалы проверены 16 октября 2026 года. Apple и IBM ещё требуют исследования; Google и Meta — дополнительной проверки. Распределение интервьюеров предварительное.',researchLink:'Исследование и его ограничения ↗',feedbackEye:'После интервью',feedbackTitle:'Разбор. Не приговор.',feedbackDesc:'Планируется: отдельный платный разбор с конкретными примерами, улучшениями ответов и советами для практики. Отправка по email. Цена будет указана до покупки.',feedbackButton:'Как будет работать разбор',footerTag:'Чуть больше готовности.',aboutLabel:'О проекте',privacyLabel:'Данные',aiLabel:'AI и ограничения',footerPreview:'В РАЗРАБОТКЕ',humors:['Без шуток','С огоньком','На полную'],assigned:'Ваш интервьюер: ',welcome:'Ваше место готово.',previewLabel:'ПРЕДПРОСМОТР · ЗАРАНЕЕ НАПИСАННЫЙ ПРИМЕР',resumeYes:'Резюме добавлено для предпросмотра',resumeNo:'Без резюме',payPending:'$1 за интервью · PayPal ещё не подключён',payNote:'Это заранее написанное вступление, а не ответ AI. Интервью не началось, оплата не списана, отчёт не создан.',back:'Назад к настройкам',aboutTitle:'Репетиция перед настоящим разговором.',aboutText:'NuTak — независимый проект Useless Instruments для подготовки к собеседованиям. Пятнадцать вымышленных AI-интервьюеров, каждый со своей компанией, помогут отрепетировать реальный разговор.\n\nГлавная цель — полезная практика с юмором, чтобы было легче попробовать ещё раз. NuTak не связан с перечисленными работодателями и не одобрен ими.',privacyTitle:'Ваши данные в этой версии.',privacyText:'Псевдоним, должность и текст резюме остаются в памяти страницы. Здесь нет сервера для данных, аналитики, cookies, обработки платежей или сбора email. Обновление или закрытие очищает память приложения; браузер может самостоятельно восстанавливать поля формы.\n\nСсылки на источники открывают внешние сайты с собственными правилами.\n\nДо запуска мы опишем обработку данных AI-провайдером, сохранение интервью, сроки хранения и удаление. Здесь мы не даём обещаний о хранении данных в будущей версии.',aiTitle:'Практика, а не решение о найме.',aiText:'Интервьюеры — вымышленные AI-персонажи, а не сотрудники компаний. В этой версии вступления написаны заранее; AI не подключён.\n\nБудущие вопросы будут учебными, с учётом должности и проверенных материалов компаний. AI может ошибаться. Его оценка не предсказывает решение работодателя. Формат настоящего интервью зависит от команды, должности и региона. Следуйте инструкциям рекрутера.\n\nРусский и английский — языки практики. Это не означает, что компания проводит интервью на обоих языках.',feedbackTitleModal:'Полезный разбор — по желанию.',feedbackText:'Планируется: $1 за одно интервью. Подробный разбор можно будет купить отдельно. Его цена пока не определена.\n\nEmail понадобится только покупателям разбора. Отправка — после подтверждения оплаты. PayPal может отдельно запросить платёжные данные или данные аккаунта.\n\nВ разборе будут примеры из ваших ответов, предложения по улучшению и возможность попробовать снова. Это не оценка вашей ценности и не обещание работы. Платежи и отправка email пока не подключены.'}};

['Anthropic','Olga','Ольга','The thoughtful challenger','Вдумчивый оппонент','“You considered every risk? This should be a short meeting.”','«Вы учли все риски? Тогда быстро управимся».'],
['Adobe','Katya','Катя','The creative critic','Творческий критик','“Walk me through your process. The version before the slides.”','«Расскажите о процессе. О том, который был до красивой презентации».'],
['Salesforce','Sasha','Саша','The easy conversation','Разговор без галстука','“Sell me the idea. The pen has suffered enough.”','«Продайте мне идею. Ручка уже достаточно настрадалась».'],

['IBM','Mikhail','Михаил','The experienced listener','Опытный собеседник','“We’ve always done it that way. A classic opening to a problem.”','«Мы всегда так делали. Классическое начало проблемы».']

const $=s=>document.querySelector(s), t=k=>copy[lang][k];
function personName(p){return p[lang==='en'?1:2]}
function pick(i){$('#company').value=String(i);assigned();$('#start').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});$('#position').focus({preventScroll:true})}
function assigned(){const p=people[Number($('#company').value)||0];$('#assigned').textContent=t('assigned')+personName(p)+' · '+p[0];$('#humorOut').textContent=t('humors')[Number($('#humor').value)]}
function render(){const selected=$('#company').value;document.documentElement.lang=lang;document.title=lang==='en'?'NuTak — Take a seat.':'NuTak — Присаживайтесь.';document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(['heroTitle','setupTitle'].includes(el.dataset.i))el.innerHTML=v;else el.textContent=v});document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('#en').setAttribute('aria-pressed',String(lang==='en'));$('#ru').setAttribute('aria-pressed',String(lang==='ru'));$('.close').ariaLabel=lang==='en'?'Close':'Закрыть';$('.hero-art').ariaLabel=lang==='en'?'An empty red interview chair':'Пустое красное кресло для собеседования';$('#company').replaceChildren(...people.map((p,i)=>new Option(p[0],String(i))));$('#company').value=selected||'0';$('#positions').replaceChildren(...(lang==='en'?['Software engineer','Product manager','Data scientist','Designer','Mechanical engineer','Sales representative','Intern']:['Инженер-программист','Менеджер продукта','Специалист по данным','Дизайнер','Инженер-механик','Специалист по продажам','Стажёр']).map(v=>new Option(v,v)));$('#cards').innerHTML=people.slice(0,3).map((p,i)=>`<article class="card"><span class="number">0${i+1} / 15</span><span class="company">${p[0]}</span><div class="character" aria-hidden="true">${['⌐◯—◯','✳','↗'][i]}</div><div class="badge">${lang==='en'?'FICTIONAL AI INTERVIEWER':'ВЫМЫШЛЕННЫЙ AI-ИНТЕРВЬЮЕР'}</div><h3>${personName(p)}</h3><p>${p[lang==='en'?3:4]}</p><blockquote>${p[lang==='en'?5:6]}</blockquote><button class="text-btn" type="button" data-pick="${i}">${lang==='en'?'Practice for':'Практика для'} ${p[0]} ↗</button></article>`).join('');$('#roster').innerHTML=people.map((p,i)=>`<button type="button" class="roster-person" data-pick="${i}"><strong>${personName(p)}</strong><span>${p[0]} · ${p[lang==='en'?3:4]}</span></button>`).join('');assigned()}
function openModal(title,body){const box=$('#modalContent');box.replaceChildren();const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;box.append(h,p);$('#modal').showModal()}
$('#en').onclick=()=>{lang='en';render()};$('#ru').onclick=()=>{lang='ru';render()};$('#company').onchange=assigned;$('#humor').oninput=assigned;document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b)pick(Number(b.dataset.pick));const m=e.target.closest('[data-modal]');if(m)openModal(t(m.dataset.modal+'Title'),t(m.dataset.modal+'Text'))});$('.close').onclick=()=>$('#modal').close();$('#feedback').onclick=()=>openModal(t('feedbackTitleModal'),t('feedbackText'));
$('#setup').onsubmit=e=>{e.preventDefault();const nickname=$('#nickname').value.trim(),position=$('#position').value.trim();if(!nickname){$('#nickname').setCustomValidity(lang==='en'?'Please enter a nickname.':'Введите псевдоним.');$('#nickname').reportValidity();return}if(!position){$('#position').setCustomValidity(lang==='en'?'Please enter a position.':'Укажите должность.');$('#position').reportValidity();return}const p=people[Number($('#company').value)];openModal(t('welcome'),'');const box=$('#modalContent');const badge=document.createElement('div');badge.className='badge';badge.textContent=t('previewLabel');box.prepend(badge);for(const [a,b] of [[nickname,personName(p)], [p[0],position], [t('difficultyLabel'),$('#difficulty option:checked').textContent]]){const row=document.createElement('div');row.className='summary-line';const left=document.createElement('span'),right=document.createElement('strong');left.textContent=a;right.textContent=b;row.append(left,right);box.append(row)}const q=document.createElement('div');q.className='sample';q.textContent=Number($('#humor').value)===0?(lang==='en'?'Let’s begin. Take your time and use specific examples.':'Начнём. Не торопитесь и приводите конкретные примеры.'):p[lang==='en'?5:6];box.append(q);const intro=document.createElement('p');intro.textContent=lang==='en'?`${nickname}, tell me about a project that prepared you for the ${position} role. What did you personally contribute?`:`${nickname}, расскажите о проекте, который подготовил вас к должности «${position}». Что именно сделали вы?`;box.append(intro);const cost=document.createElement('strong');cost.textContent=t('payPending');box.append(cost);const note=document.createElement('p');note.textContent=t('payNote');box.append(note);const back=document.createElement('button');back.type='button';back.className='cta secondary';back.textContent=t('back');back.onclick=()=>$('#modal').close();box.append(back)};['nickname','position'].forEach(id=>$('#'+id).addEventListener('input',()=>$('#'+id).setCustomValidity('')));render();
</script></body></html>
